<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD-Emulator</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181e; --line: #262c35; --text: #e8edf2; --dim: #8a96a3; --accent: #78c4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--dim); letter-spacing: .02em; }
  /* the view through the windscreen: a road at dusk */
  .road { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    background:
      linear-gradient(180deg, #2a3442 0%, #3b4553 38%, #22272e 39%, #181b20 100%); }
  .road::before { content: ""; position: absolute; left: 50%; top: 39%; width: 0; height: 61%;
    border-left: 4px dashed #6c737c; transform: translateX(-50%) perspective(300px) rotateX(55deg); transform-origin: top; opacity: .6; }
  .road::after { content: ""; position: absolute; inset: auto 0 0 0; height: 14%;
    background: linear-gradient(180deg, transparent, #050607); }
  /* the HUD: 353 x 203 at 2x, projected: black is nothing */
  .hud { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: min(470px, 54%); }
  .hud .app { position: relative; }
  .hud img { display: block; width: 100%; aspect-ratio: 353 / 203; mix-blend-mode: screen; image-rendering: auto; }
  .hud .area { position: absolute; inset: 0; border: 1px dashed rgba(255,255,255,.18); border-radius: 4px; pointer-events: none; }
  .hud.noframe .area { display: none; }
  /* BMW's own HUD bar, measured on the G87's HUD (photo 2026-11-20): right under the app's area,
     centred, 559 x 67 in the HUD's pixels (the area is 353 x 203); speed limit, speed, km/h */
  .bmw { position: absolute; left: -28.33%; width: 158.36%; top: 100%; display: block; mix-blend-mode: screen; }
  .note { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .phase { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
  .phase b { color: var(--text); font-weight: 600; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-self: start; }
  .status { font-weight: 600; margin-bottom: 10px; min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--dim); padding-right: 10px; width: 46%; }
  .buttons { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: #1f2630; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; }
  button:hover { background: #283140; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>HUD-Emulator · echte App, nachgebauter Renderer</h1>
    <div class="road">
      <div class="hud" id="hud">
        <div class="app">
          <img id="img" src="/hud.png" alt="Was die App ins HUD zeichnet">
          <div class="area" title="Der Bereich der App, 353 × 203"></div>
        </div>
          <svg class="bmw" viewBox="0 0 559 67" aria-label="BMWs eigene HUD-Leiste (nachgebaut)">
            <rect x="0" y="0" width="559" height="67" fill="#2d5b88" opacity=".9"/>
            <rect x="0" y="0" width="559" height="4" fill="#79a7d2"/>
            <rect x="362" y="0" width="150" height="3" fill="#7fd08a"/>
            <g stroke="#0e1d2c" stroke-width="3">
              <line x1="143" y1="67" x2="167" y2="5"/><line x1="238" y1="67" x2="262" y2="5"/><line x1="488" y1="67" x2="512" y2="5"/>
            </g>
            <circle cx="193" cy="36" r="25" fill="#f2f2f2" stroke="#e2493b" stroke-width="5"/>
            <text id="limit" x="193" y="43" text-anchor="middle" font-size="20" font-weight="600" fill="#111">50</text>
            <text id="speed" x="398" y="56" text-anchor="middle" font-size="50" font-weight="700" fill="#f4f6f8">0</text>
            <text x="452" y="56" font-size="15" font-weight="600" fill="#e6ebf0">km/h</text>
          </svg>
        </div>
      </div>
    </div>
    <div class="phase"><span>Fahrt: <b id="phase">–</b></span><span>Öl im simulierten Auto: <b id="oil">–</b></span><span id="t"></span></div>
    <p class="note">Gestrichelt: der Bereich der App (353 × 203). Die blaue Leiste darunter ist BMWs eigene, nach dem Foto vom G87 nachgebaut (Lage und Größe gemessen). Schwarz ist im HUD unsichtbar.</p>
  </section>
  <aside>
    <h1>iDrive-Bildschirm der App</h1>
    <div class="status" id="status"></div>
    <div class="buttons">
      <button id="press" type="button">HUD an / aus</button>
      <button id="frame" type="button">Rahmen aus</button>
      <button id="cds" type="button">Fahrzeugsignal aus</button>
    </div>
    <table id="rows"></table>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;
  async function tick() {
    if (busy) return;
    busy = true;
    try {
      const s = await (await fetch('/state', { cache: 'no-store' })).json();
      $('phase').textContent = s.phase;
      $('oil').textContent = s.oil + ' °C';
      $('t').textContent = 't = ' + s.t + ' s';
      $('speed').textContent = s.speed;
      $('limit').textContent = s.limit;
      $('cds').textContent = s.cds ? 'Fahrzeugsignal aus' : 'Fahrzeugsignal an';
      $('status').textContent = s.status;
      $('rows').innerHTML = '';
      for (const r of s.rows) {
        const tr = document.createElement('tr');
        for (const c of r) { const td = document.createElement('td'); td.textContent = c == null ? '' : c; tr.appendChild(td); }
        $('rows').appendChild(tr);
      }
      const img = new Image();
      img.onload = () => { $('img').src = img.src; };
      img.src = '/hud.png?' + Date.now();
    } catch (e) {
      $('status').textContent = 'Emulator nicht erreichbar';
    } finally {
      busy = false;
    }
  }
  $('press').onclick = () => fetch('/press').then(tick);
  $('cds').onclick = () => fetch('/cds').then(tick);
  $('frame').onclick = () => {
    const on = $('hud').classList.toggle('noframe');
    $('frame').textContent = on ? 'Rahmen an' : 'Rahmen aus';
  };
  setInterval(tick, 300);
  tick();
</script>
</body>
</html>
